  ["Interface", "100 + 50 pin PAB"],
  ["Dimensions", "36 × 29 × 5 mm"],
  ["Weight", "5.0 g"],
  ["Operating temp", "−10 to +60 °C"],
  ["Hardware rev", "Rev 1.0"],
]
