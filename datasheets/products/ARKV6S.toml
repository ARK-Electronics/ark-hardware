kicker = "FLIGHT CONTROLLER"
subtitle = "Single-IMU FMUv6X autopilot module on the Pixhawk Autopilot Bus"
doc_id = "ARK-DS-ARKV6S"
sources = "Compiled from the ARKV6S Production schematic Rev 1.0 (29 Jan 2026), the ARKV6S Production bill of materials, the ARKV6S production STEP model, and ARK Electronics published documentation. Temperature ratings per component data sheets."
photo = "arkv6s.jpg"
photo_frame = true
intro = [
  "The USA-built ARKV6S flight controller is a cost-optimised single-IMU variant of the ARKV6X, based on the FMUv6X and Pixhawk Autopilot Bus (PAB) open source standards. An STM32H743 processor reads one industrial-grade IMU, a barometer and a magnetometer.",
  "It fits any Pixhawk Autopilot Bus carrier, including the ARK PAB Carrier, ARK Jetson PAB Carrier and ARK Jetson PAB V3.",
]
features = [
  "Single industrial IMU with independent power domain",
  "– 1 × TDK InvenSense IIM-42653 (SPI1)",
  "Bosch BMP390 barometer and ST IIS2MDC magnetometer on internal I2C4",
  "Cypress FM25V02A 256 kbit FRAM for non-volatile parameter storage",
  "1 W sensor heater under closed-loop control",
  "Supercapacitor-backed real-time clock",
  "microSD logging on a 4-bit SDMMC interface",
  "Pixhawk Autopilot Bus (PAB) form factor",
]
