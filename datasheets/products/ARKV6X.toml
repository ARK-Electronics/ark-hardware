title = "ARKV6X"
version = "1.0"
date = "2026-10-29"
rev = "4.1"
kicker = "FLIGHT CONTROLLER"
subtitle = "Triple-IMU FMUv6X autopilot module on the Pixhawk Autopilot Bus"
doc_id = "ARK-DS-ARKV6X"
sources = "Compiled from the ARKV6X Production schematic Rev 4.1 (13 Dec 2023), the ARKV6X Production bill of materials, the ARKV6X production STEP model, and ARK Electronics published documentation. Temperature ratings per component data sheets; the RTC backup supercapacitor sets both limits."
photo = "arkv6x.jpg"
photo_frame = true
intro = [
  "The USA-built ARKV6X flight controller is based on the FMUv6X and Pixhawk Autopilot Bus (PAB) open source standards. An STM32H743 processor reads three time-synchronised IMUs, each on its own SPI bus and its own switched 3.3 V rail, making data averaging, voting and filtering possible rather than leaving the estimator with a single point of failure.",
  "Conforming to the PAB form factor, it drops into any PAB-compatible carrier — the ARK PAB Carrier, ARK Jetson PAB Carrier or ARK Jetson PAB V3 — so one autopilot module moves between airframes and compute payloads.",
]
features = [
  "Three synchronised IMUs, each independently powered",
  "– 2 × TDK InvenSense ICM-42688-P (SPI2, SPI3)",
  "– 1 × TDK InvenSense IIM-42652 industrial IMU (SPI1)",
  "Bosch BMP390 barometer and BMM150 magnetometer on internal I2C4",
  "Four independently switched 3.3 V sensor rails — one per sensor domain",
  "Cypress FM25V02A 256 kbit FRAM for non-volatile parameter storage",
  "1 W (25 Ω) sensor heater under PWM closed-loop control",
  "Supercapacitor-backed real-time clock",
  "microSD logging on a 4-bit SDMMC interface",
]
glance = [
  ["Standard", "FMUv6X / PAB"],
  ["MCU", "STM32H743IIK6"],
  ["IMUs", "3 (2 + 1 industrial)"],
  ["Baro / Mag", "BMP390 / BMM150"],
  ["Supply", "4.5–5.5 V, 500 mA"],
  ["Operating temp", "−10 to +60 °C"],
  ["Interface", "100 + 50 pin PAB"],
  ["Dimensions", "36 × 29 × 5 mm"],
  ["Weight", "5.0 g"],
  ["Hardware rev", "Rev 4.1"],
]
