subtitle = "5.2 V / 6 A regulated supply and digital power monitor for the Pixhawk Autopilot Bus"
doc_id = "ARK-DS-ARK-12S-PAB-Power-Module"
sources = "Compiled from the ARK 12S PAB Power Module Production schematic Rev 3.1 (24 Apr 2026), the Production bill of materials, the production STEP model, and ARK Electronics published documentation. Temperature ratings per component data sheets."
photo = "ark_12s_pab_power_module.jpg"
photo_frame = true
intro = [
  "The USA-built ARK 12S PAB Power Module powers a Pixhawk Autopilot Bus carrier and monitors its battery. A TI INA238 measures a 100 A continuous battery path through a 0.1 mΩ shunt, and a synchronous buck supplies 5.2 V at 6 A for the avionics.",
  "Its 6-pin Molex CLIK-Mate output matches the ARK PAB Carrier power pinout.",
]
features = [
  "100 A continuous battery current path (parallel for higher)",
  "TI LM70880 synchronous buck — 5.2 V / 6 A regulated output",
  "TI INA238 digital power monitor with 0.1 mΩ shunt (I²C)",
  "10–75 V input range (12S capable)",
  "6-pin Molex CLIK-Mate output matching PAB pinout",
  "Solder-pad battery input and output",
  "Includes 6-pin Molex cable, 12S capacitor and TVS diode",
]
