kicker = "POWER MODULE"
subtitle = "Dual 5.2 V / 6 A + 12 V / 6 A regulated supply and digital power monitor for the Pixhawk Autopilot Bus"
doc_id = "ARK-DS-ARK-12S-Payload-Power-Module"
sources = "Compiled from the ARK 12S Payload Power Module Production schematic Rev 1.2 (25 Aug 2026), the Production bill of materials, the manufacturing documentation, and ARK Electronics published documentation. Temperature ratings per component data sheets."
photo = "ark_12s_payload_power_module.jpg"
photo_frame = true
intro = [
  "The USA-built ARK 12S Payload Power Module powers a Pixhawk Autopilot Bus carrier and its payload and monitors the battery. A TI INA238 measures a 100 A continuous battery path, and two synchronous bucks supply 5.2 V at 6 A for the avionics and 12 V at 6 A for payloads.",
  "Its 6-pin Molex CLIK-Mate output matches the ARK PAB Carrier power pinout; a 4-pin CLIK-Mate carries the 12 V rail.",
]
features = [
  "100 A continuous battery current path (parallel for higher)",
  "Dual TI LM70880 bucks — 5.2 V / 6 A + 12 V / 6 A",
  "TI INA238 digital power monitor with 0.1 mΩ shunt (I²C)",
  "10–75 V input (15 V min for 12 V rail at full load)",
  "6-pin Molex (5 V / I²C) matching PAB pinout",
  "4-pin Molex for 12 V payload",
  "Includes both Molex cables",
]
