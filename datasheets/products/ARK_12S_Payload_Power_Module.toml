photo_frame = true
intro = [
  "The USA-built ARK 12S Payload Power Module provides dual regulated outputs and high-accuracy digital battery monitoring for Pixhawk Autopilot Bus carriers. A 100 A continuous battery path is monitored by a TI INA238 while two independent synchronous bucks deliver 5.2 V / 6 A for avionics and 12 V / 6 A for payloads.",
  "The 6-pin Molex output matches the ARK PAB Carrier power pinout; the additional 4-pin Molex supplies the 12 V payload rail. Parallel modules increase continuous battery current beyond 100 A.",
]
features = [
  "100 A continuous battery current path (parallel for higher)",
  "Dual TI LM70880 bucks — 5.2 V / 6 A + 12 V / 6 A",
  "TI INA238 digital power monitor with 0.1 mΩ shunt (I²C)",
  "10–75 V input (15 V min for 12 V rail at full load)",
  "6-pin Molex (5 V / I²C) matching PAB pinout",
  "4-pin Molex for 12 V payload",
  "Includes both Molex cables",
]
