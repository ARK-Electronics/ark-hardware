[[sections]]
kind = "notes"
title = "NOTES"
items = [
  "The power monitor measures only current flowing from the battery input pads to the battery output pads. Wire the ESCs and every other battery load to the output pads.",
  "Each output has its own short-circuit and thermal protection and recovers on its own. The power monitor runs from the 5.2 V output, so a 5.2 V fault also stops battery monitoring.",
  "Active cooling is recommended when operating at high battery current or high 5 V / 12 V regulator loads.",
  "For continuous battery current above 100 A, operate multiple modules in parallel.",
  "Battery input and output are solder pads for high-current connections.",
]

