intro = [
  "The USA-built ARK 4IN1 ESC is a high-performance 4-channel electronic speed controller for brushless motors. Four independent STM32F051 MCUs drive a 3-phase power stage delivering 50 A continuous / 75 A burst per motor under ARK32 firmware (supports AM32).",
  "An onboard 0.2 mΩ shunt and current-sense amplifier provide 100 A/V sensing. Configure KV and pole count for each motor before first use.",
]
