items = [
  "Before first use, configure KV and pole count for each motor.",
  "DShot is the recommended input protocol. PWM requires calibration.",
  "Motor and battery connections are solder pads.",
  "Current ratings are board thermal limits with airflow; burst duration depends on cooling. With all four motors loaded, the shared current-sense shunt limits each to about 43 A.",
  "The 450 µF onboard bulk capacitance suits 3S–6S with short battery leads. At 8S, add an external bulk capacitor across the battery input.",
