intro = [
  "The USA-built ARK 4IN1 ESC CONS is the ARK 4IN1 ESC with MR30 motor connectors and bolt-on battery leads, so it installs without soldering. One STM32F051 MCU and TI DRV8328 gate driver per motor run ARK32, ARK's open-source AM32 fork.",
  "The board is rated 50 A continuous and 75 A burst per motor; the MR30 connectors limit that to 30 A continuous and 40 A burst.",
]
