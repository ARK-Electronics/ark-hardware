doc_id = "ARK-DS-ARK-ADIS16507"
sources = "Compiled from the ARK ADIS16507 Carrier Production schematic Rev 1, the Production bill of materials, manufacturing documentation, and ARK Electronics published documentation. IMU dynamic ranges per ADIS16507-2BMLZ and ADIS16507-3BMLZ; IMU environmental ratings per the Analog Devices ADIS16507 data sheet Rev. A. Board temperature rating per component data sheets; the JST-GH connector sets −25 °C."
photo = "ark_adis16507.jpg"
intro = [
  "The USA-built ARK ADIS16507 is a compact carrier for the Analog Devices ADIS16507 precision MEMS IMU, sold with the ADIS16507-2 or ADIS16507-3. It provides a factory-calibrated triaxial gyroscope (±500 °/s or ±2000 °/s) and triaxial accelerometer (±40 g) over SPI, with onboard 3.3 V regulation from a 5 V supply.",
  "The 11-pin JST-GH connector matches the ARK PAB SPI pinout for direct use with ARK flight controllers and carriers.",
]
