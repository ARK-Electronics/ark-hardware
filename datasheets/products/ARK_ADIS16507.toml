  "Accel: ±40 g (±392 m/s²)",
  "Factory calibrated sensitivity, bias, and alignment",
  "SPI interface with data-ready",
  "Onboard 3.3 V LDO from 5 V input",
  "11-pin JST-GH matching ARK PAB SPI pinout",
  "Includes cable",
]
