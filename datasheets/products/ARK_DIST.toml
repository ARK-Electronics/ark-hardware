[[sections]]
kind = "range"
title = "RANGE"
corner = "SURFACE"
cols = ["BRIGHT SUN", "DUSK"]
rows = ["Asphalt", "Grass"]
note = "Reliable range: the farthest distance with ≥50 % of readings valid and within 5 m of the reference, at default settings. Bright sun: sun 49–61° above the horizon; a lower sun gives more range. Dusk: sun below 6°. * Limited by the maximum reported distance; the sensor was still measuring at the flight ceiling (SR 38 m, MR 54 m). Wet surfaces reduce range; open water (~2 % reflectivity) gives only short, intermittent returns."

