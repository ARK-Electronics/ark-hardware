title = "ARK DIST"
version = "1.0"
date = "2026-10-29"
rev = "1.0"
kicker = "TIME-OF-FLIGHT DISTANCE SENSOR"
subtitle = "DroneCAN and MAVLink laser distance sensor in short-, mid- and long-range variants"
doc_id = "ARK-DS-ARK-DIST"
sources = "Compiled from ARK Electronics published documentation and ARK flight measurements. Laser and optical characteristics per Broadcom."
out = "ARK_DIST/datasheet/ARK_DIST_Datasheet.pdf"
photo = "ark_dist.jpg"
intro = [
  "The USA-built ARK DIST pairs a Broadcom AFBR-S50 time-of-flight sensor with an STM32F412VG. The SR, MR and LR variants share one board and case and differ only in the sensor module.",
]
features = [
  "Broadcom AFBR-S50 time-of-flight sensor, 850 nm Class 1 laser",
  "Max reported distance: SR 30 m, MR 50 m, LR 100 m",
  "DroneCAN and MAVLink\u00a02 output",
  "2× CAN and UART on Pixhawk-standard JST-GH, debug on JST-SH",
  "PX4 and ArduPilot; ROS 2 via ros2_dronecan",
]
glance = [
  ["Sensor", "Broadcom AFBR-S50"],
  ["Variants", "SR / MR / LR"],
  ["Max reported distance", "30 / 50 / 100 m"],
  ["Update rate", "20 / 15 / 10 Hz"],
  ["Supply", "5 V"],
  ["Dimensions", "20 × 28 × 14 mm"],
  ["Weight", "4 g"],
  ["Hardware rev", "Rev 1.0"],
]
compliance = ["Designed and manufactured in the USA", "NDAA compliant"]
resources = [
  ["STORE", "arkelectron.com/product/ark-dist-sr/"],
