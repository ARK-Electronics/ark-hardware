[[sections]]
kind = "notes"
title = "NOTES"
items = [
  "PX4 runs DShot and bidirectional DShot on outputs 1–8; output 9 is PWM only. ArduPilot runs DShot on all 9 and bidirectional DShot on outputs 1–4.",
  "The ESC connector matches the ARK 4IN1 ESC, which ships with the cable. CURRENT_IN has no divider, so the current scale is the ESC's.",
  "USB-C alone powers the board and its 5 V outputs, but not the 12 V rail.",
  "CAN1 is terminated on the board (120 Ω).",
]

