title = "ARK FPV"
version = "1.1"
date = "2026-10-29"
rev = "4.2"
kicker = "FLIGHT CONTROLLER"
subtitle = "STM32H743 flight controller for 30.5 mm stacks, powered directly from 3S–12S"
doc_id = "ARK-DS-ARK-FPV"
sources = "Compiled from the ARK FPV Production schematic Rev 4.2 (4 Mar 2026), the ARK FPV STEP model, the PX4 and ArduPilot board definitions, and ARK Electronics published documentation. Temperature ratings per component data sheets."
photo = "ark_fpv.jpg"
intro = [
  "The USA-built ARK FPV puts an STM32H743 processor, IMU, barometer, magnetometer and 1 W sensor heater on a 30.5 mm stack board. It runs directly from a 3S–12S battery, with a 5 V 2 A regulator shared by the board and peripherals and a switched 12 V 2 A rail for video transmitters and payloads.",
  "It supports PX4, ArduPilot and Betaflight. PX4 ships by default.",
]
features = [
  "STM32H743IIK6, 480 MHz, 2 MB flash, 1 MB RAM",
  "TDK InvenSense IIM-42653 industrial IMU; ST LSM6DSV32X on the ARK FPV 32X",
  "Bosch BMP390 barometer and ST IIS2MDC magnetometer",
  "Direct 3S–12S battery input (5.5–54 V)",
  "5 V 2 A and 12 V 2 A regulators; 12 V switched by the flight controller",
  "9 PWM outputs, DShot and bidirectional DShot capable",
  "1 W sensor heater under closed-loop control",
  "microSD logging on a 4-bit SDMMC bus",
]
glance = [
  ["MCU", "STM32H743IIK6"],
  ["IMU", "IIM-42653 / LSM6DSV32X"],
  ["Baro / Mag", "BMP390 / IIS2MDC"],
  ["Input", "3S–12S, 5.5–54 V"],
  ["Regulators", "5 V 2 A, 12 V 2 A"],
  ["Operating temp", "−25 to +85 °C"],
  ["Dimensions", "36 × 36 × 8 mm"],
  ["Weight", "7.5 g"],
  ["Hardware rev", "Rev 4.2"],
]
compliance = ["Designed and manufactured in the USA", "NDAA compliant", "Blue UAS Framework listed (ARK FPV)"]
