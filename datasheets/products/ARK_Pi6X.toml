[[sections]]
kind = "notes"
title = "NOTES"
items = [
  "DShot runs on outputs 1–6. Outputs 7–8 are on TIM12, which has no DMA, so they run PWM and OneShot only.",
  "The compute module's USB reaches the flight controller, USB-C and both USB JST-GH ports through a full-speed (12 Mbps) hub. A cable in the programming micro USB switches the compute module to that port and disconnects the hub until reboot.",
  "With a Compute Module 5, only CAM1 works and the Pi UART numbering shifts by one; USB 3.0 isn't wired.",
  "CAN1 is terminated on the board (120 Ω).",
  "Temperature ratings are for the carrier. The Raspberry Pi CM4 and CM5 are rated −20 °C to +85 °C.",
]

