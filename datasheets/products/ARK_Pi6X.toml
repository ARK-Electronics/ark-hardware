title = "ARK Pi6X"
version = "1.0"
date = "2026-10-30"
rev = "2.0"
kicker = "FLIGHT CONTROLLER"
subtitle = "Raspberry Pi compute module carrier with an STM32H743 flight controller and 2S–6S power input"
doc_id = "ARK-DS-ARK-PI6X"
sources = "Compiled from the ARK Compute Module FC Production schematic Rev 2.0 (11 Apr 2024), the ARK Pi6X Flow Rev 2.0 STEP model, the PX4 and ArduPilot board definitions, the MIC2026A-76A data sheet (DS20006608A), and ARK Electronics published documentation. Temperature ratings per component data sheets."
photo = "ark_pi6x.jpg"
intro = [
  "The USA-built ARK Pi6X puts a Raspberry Pi Compute Module carrier, an STM32H743 flight controller and a 2S–6S battery input with current monitoring on one board, with 30.5 × 30.5 mm mounting for a 4-in-1 ESC. The Pi runs ARK-OS and reaches the flight controller over USB and a dedicated UART.",
  "The ARK Pi6X Flow is the same board with an optical flow sensor and a distance sensor fitted. PX4 ships by default; ArduPilot is supported.",
]
features = [
  "STM32H743IIK6, 480 MHz, 2 MB flash, 1 MB RAM",
  "Dual heated TDK InvenSense ICM-42688-P IMUs on separate SPI buses",
  "Bosch BMP390 barometer and ST IIS2MDC magnetometer",
  "Raspberry Pi Compute Module 4; Compute Module 5 with reduced I/O",
  "2S–6S battery input, TI INA226 voltage and current monitor",
  "8 PWM outputs, DShot on outputs 1–6",
  "Pi Ethernet, micro HDMI, two MIPI CSI cameras, USB-C host",
  "Pi6X Flow: PixArt PAW3902 flow and Broadcom AFBR-S50LV85D distance",
]
glance = [
  ["MCU", "STM32H743IIK6"],
  ["Compute", "Raspberry Pi CM4 / CM5"],
  ["IMUs", "2 × ICM-42688-P"],
  ["Baro / Mag", "BMP390 / IIS2MDC"],
  ["Input", "2S–6S, 5.5–25.2 V"],
  ["Operating temp", "−10 to +60 °C"],
  ["Flow operating", "0 to +60 °C"],
  ["Dimensions", "91.5 × 56 mm"],
  ["Weight", "41 g"],
  ["Hardware rev", "Rev 2.0"],
]
compliance = ["Designed and manufactured in the USA", "NDAA compliant", "Blue UAS Framework listed (ARK Pi6X)"]
resources = [
  ["STORE", "arkelectron.com/product/ark-pi6x/"],
  ["", "arkelectron.com/product/ark-pi6x-flow/"],
  ["DOCS", "docs.arkelectron.com/products/flight-controller/ark-pi6x-flow"],
