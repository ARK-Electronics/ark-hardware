[[sections]]
kind = "notes"
title = "NOTES"
items = [
  "VDD_5V_PERIPH is shared by J1, J2, and J7 and is limited to 1.5 A in total.",
  "VBUS on J6 is passed through from Payload Bus pin 24 and is not switched or protected on this board.",
  "J5 carries the Ethernet pairs only; the connector shell is intentionally left unconnected.",
  "Test points: TP1 = VDD_5V_HIGHPOWER_nEN, TP2 = VDD_5V_PERIPH, TP3 = FAULT (open drain).",
  "Operating temperature is limited by the JST-GH connectors; all other components are rated wider.",
]
