title = "ARK Pixhawk Payload Bus Breakout"
version = "1.0"
date = "2026-10-29"
rev = "1.0"
kicker = "PAYLOAD BUS BREAKOUT"
subtitle = "Pixhawk Payload Bus to Pixhawk-standard JST-GH, with a protected 5 V peripheral rail"
doc_id = "ARK-DS-ARK-PIXHAWK-PAYLOAD-BUS-BREAKOUT"
sources = "Compiled from the ARK Pixhawk Payload Bus Breakout Rev 1.0 schematic, the Rev 1.0 bill of materials, and the Rev 1.0 manufacturing documentation. Signal names are as given in the schematic."
photo = "ark_pixhawk_payload_bus_breakout.jpg"
photo_frame = true
intro = [
  "The USA-built ARK Pixhawk Payload Bus Breakout fans the 30-pin Payload Bus out to individually keyed Pixhawk-standard JST-GH connectors. UART4/I2C3, CAN, Ethernet, USB, and GPIO each get their own connector, so a payload can be wired to an ARK carrier without a custom harness.",
  "A 5 V supply enters on a 6-pin Molex Pico-Clasp using the Pixhawk power-module pinout. An onboard TI BQ24315 protection switch derives the VDD_5V_PERIPH rail with a 1.5 A current limit, overvoltage protection, and a fault flag, and is gated by the autopilot over VDD_5V_PERIPH_nEN.",
]
features = [
  "30-pin, 0.5 mm pitch Payload Bus FFC connector",
  "UART4 and I2C3 on 6-pin JST-GH",
  "CAN on 4-pin JST-GH",
  "Ethernet on 4-pin JST-GH",
  "USB on 4-pin JST-GH",
  "GPIO, FMU PWM, and capture on 7-pin JST-GH",
  "1.5 A protected 5 V peripheral rail (TI BQ24315): overvoltage, overcurrent, fault flag",
  "Includes 30-pin, 0.5 mm pitch, 150 mm FFC cable",
]
glance = [
  ["Payload bus", "30-pin FFC"],
  ["Interfaces", "UART, I2C, CAN, Ethernet, USB, GPIO"],
  ["Peripheral rail", "5 V @ 1.5 A"],
  ["Supply", "5 V"],
  ["Dimensions", "34.25 × 18.5 × 5.81 mm"],
  ["Weight", "3.5 g"],
  ["Hardware rev", "Rev 1.0"],
]
compliance = ["Designed and manufactured in the USA"]
