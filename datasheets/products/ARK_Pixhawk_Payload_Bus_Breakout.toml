note = "Pin 28 (VDD_5V_HIGHPOWER_nEN) is brought out to test point TP1 only and is not otherwise connected on this board. Pin 29 (VDD_5V_PERIPH_nEN) drives the enable input of the onboard protection switch through a 47 kΩ series resistor; pulling it low enables the VDD_5V_PERIPH rail."

